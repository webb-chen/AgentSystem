services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_REGION: ${BUILD_REGION:-global}
        GOPROXY: ${GOPROXY:-}
    image: mingyingkeji-sandbox:local
    env_file:
      - .env
    environment:
      MINGYINGKEJI_SANDBOX_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in sandbox/.env or your environment}@sandbox-postgres:5432/${POSTGRES_DB:-mingyingkeji_sandbox}?sslmode=disable
      MINGYINGKEJI_SANDBOX_SERVER_PORT: ${MINGYINGKEJI_SANDBOX_SERVER_PORT:-2660}
      MINGYINGKEJI_SANDBOX_API_KEY: ${MINGYINGKEJI_SANDBOX_API_KEY:-}
      MINGYINGKEJI_SANDBOX_ADVERTISE_URL: http://localhost:${MINGYINGKEJI_SANDBOX_SERVER_PORT:-2660}
      MINGYINGKEJI_SANDBOX_PUBLIC_BASE_URL: http://localhost:${MINGYINGKEJI_SANDBOX_SERVER_PORT:-2660}
      MINGYINGKEJI_SANDBOX_DEPENDENCY_ROOTFS_DIR: ${MINGYINGKEJI_SANDBOX_DEPENDENCY_ROOTFS_DIR:-/var/lib/mingyingkeji-sandbox/dependency-rootfs}
      MINGYINGKEJI_SANDBOX_PREBUILT_DEPENDENCY_ROOTFS_DIR: ${MINGYINGKEJI_SANDBOX_PREBUILT_DEPENDENCY_ROOTFS_DIR:-/opt/mingyingkeji/prebuilt-dependency-rootfs}
      MINGYINGKEJI_SANDBOX_REQUIRED_DEPENDENCY_PROFILES: ${MINGYINGKEJI_SANDBOX_REQUIRED_DEPENDENCY_PROFILES:-skill-office}
      MINGYINGKEJI_SANDBOX_DEPENDENCY_BUILD_COMMAND: ${MINGYINGKEJI_SANDBOX_DEPENDENCY_BUILD_COMMAND:-/usr/local/bin/mingyingkeji-sandbox-build-dependency-profile}
    networks:
      default:
      mingyingkeji-network:
        aliases:
          - mingyingkeji-sandbox
    ports:
      - "${MINGYINGKEJI_SANDBOX_SERVER_PORT:-2660}:${MINGYINGKEJI_SANDBOX_SERVER_PORT:-2660}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sandbox-data:/var/lib/mingyingkeji-sandbox
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json, os, sys, urllib.request; port=os.environ.get('MINGYINGKEJI_SANDBOX_SERVER_PORT', '2660'); res=urllib.request.urlopen(f'http://127.0.0.1:{port}/ready', timeout=3); body=json.load(res); sys.exit(0 if res.getcode() == 200 and body.get('ready') is True else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in sandbox/.env or your environment}
    networks:
      default:
        aliases:
          - sandbox-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      default:
        aliases:
          - sandbox-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sandbox-data:
  postgres-data:
  redis-data:

networks:
  mingyingkeji-network:
    external: true
    name: mingyingkeji-api_mingyingkeji-network
